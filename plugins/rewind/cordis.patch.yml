# Composable-bundle layer contributed by @zaimaxvx/dsh-plugin-rewind.
# Installed through `dsh plugin --profile <name> add github:ZaiMaxvx/dsh-rewind`
# (git / tarball; npm under the scoped name). The line resolves through Node
# module resolution to this package's entry, which registers the /rewind host
# command. The browser half is discovered via the package.json dsh.client
# declaration.
- insert:
    - id: rewind
      name: '@zaimaxvx/dsh-plugin-rewind'
